daemon off;
error_log /dev/stdout info;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    proxy_buffers 16 16k;
    proxy_buffer_size 16k;

    keepalive_timeout  65;
    client_max_body_size 100M;
    client_body_timeout 300s;
    send_timeout 300s;

    # DOCX conversion and large uploads can exceed nginx defaults (60s).
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    server {

        listen 80;
        server_name _;

        sendfile off;

        root /usr/share/nginx/html/auth_server;
        index index.html;

        error_page 401 = @auth_server;

        location = /api/version/ {
            proxy_pass http://127.0.0.1:8000$request_uri;
        }

        # Auth-server login UI (no auth). Keep /login as the public login URL.
        # The auth-server SPA is served directly here, so the browser remains
        # on /login while the user fills in the login form.
        location = /login {
            root /usr/share/nginx/html/auth_server;
            add_header Cache-Control "no-store";
            try_files /index.html =404;
        }

        location ^~ /signin/ {
            return 302 /login;
        }

        # Static assets: UI and auth-server both use /assets/* — try UI first,
        # then auth-server (login page breaks if only UI is served).
        location ^~ /assets/ {
            root /usr/share/nginx/html/ui;
            try_files $uri @auth_server_assets;
        }

        location @auth_server_assets {
            internal;
            root /usr/share/nginx/html/auth_server;
            try_files $uri =404;
        }

        location = /papermerge-runtime-config.js {
            default_type application/javascript;
            root /usr/share/nginx/html/ui;
            try_files /papermerge-runtime-config.js @auth_runtime_config;
        }

        location @auth_runtime_config {
            internal;
            root /usr/share/nginx/html/auth_server;
            try_files /papermerge-runtime-config.js =404;
        }

        location = /favicon.ico {
            root /usr/share/nginx/html/ui;
            try_files /favicon.ico @auth_favicon;
        }

        location @auth_favicon {
            internal;
            root /usr/share/nginx/html/auth_server;
            try_files /favicon.ico =404;
        }

        location = /pdf.worker.min.js {
            root /usr/share/nginx/html/ui;
            try_files /pdf.worker.min.js =404;
        }

        # i18n bundles (UI + auth-server login)
        location ^~ /localization/auth-server/ {
            root /usr/share/nginx/html/auth_server;
            try_files $uri =404;
        }

        location ^~ /localization/ {
            root /usr/share/nginx/html/ui;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # Auth-server login/registration (no core API auth_request gate).
        location ~ ^/api/(token|register)(/.*)?$ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:4010;
        }

        # Full-system export streams a large archive. Buffering or the default
        # 300s read timeout aborts the download before the browser saves a file.
        location = /api/admin/backup/export {
            auth_request /verify;
            error_page 401 403 = @auth_server;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;
            auth_request_set $auth_status $upstream_status;

            gzip off;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://127.0.0.1:8000$request_uri;
        }

        # Full-system import. The default 100m body limit closes the upload
        # (browser: ERR_CONNECTION_RESET) before restore starts.
        location = /api/admin/backup/import {
            auth_request /verify;
            error_page 401 403 = @auth_server;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;
            auth_request_set $auth_status $upstream_status;

            client_max_body_size 0;
            client_body_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_request_buffering on;
            proxy_pass http://127.0.0.1:8000$request_uri;
        }

        location ~ ^/api(/?)(.*)  {
            auth_request /verify;
            # /verify may return 500 for expired/invalid tokens in auth-server.
            # Treat that as unauthenticated instead of a hard 500 on the UI/API.
            error_page 401 403 = @auth_server;
            error_page 500 = @auth_server;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;
            auth_request_set $auth_status $upstream_status;
            proxy_pass http://127.0.0.1:8000$request_uri;
        }

         location ~ ^/ws(/?)(.*)  {
            auth_request /verify;
            error_page 401 403 = @auth_server;
            error_page 500 = @auth_server;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;
            auth_request_set $auth_status $upstream_status;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass http://127.0.0.1:8000/ws/$2$is_args$args;
        }

        location / {
            auth_request /verify;
            error_page 401 403 = @auth_server;
            error_page 500 = @auth_server;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;
            auth_request_set $auth_status $upstream_status;

            proxy_set_header Host $host;
            root /usr/share/nginx/html/ui;
            try_files $uri /index.html =404;
        }

        location = /verify {
            internal;
            # Auth must not apply the 100m upload cap. Otherwise a large
            # backup import fails here with 413, and nginx turns that into 500.
            client_max_body_size 0;
            proxy_pass http://127.0.0.1:4010;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Remote-Addr $remote_addr;
            proxy_set_header X-Original-Host $host;
        }

        location @auth_server {
            if ($uri ~ /api/(token|auth|register)) {
                rewrite ^/api/(.*) /$1 break;
                proxy_pass http://127.0.0.1:4010;
            }

            if ($uri ~ /api) {
                return 401 "Unauthorized";
            }

            # error_page replaces the status with 200. Without no-store the
            # browser can cache this login document for the app URL.
            add_header Cache-Control "no-store";
            root /usr/share/nginx/html/auth_server;
            try_files $uri /index.html =404;
        }
    }
}
